openapi: 3.1.0
info:
  title: App API
  version: 0.1.0
  description: >-
    OpenAPI specification of App. JSON request bodies are limited to 1 MiB;
    oversized bodies return 400. JSON responses include Cache-Control no-store.
servers:
  - url: http://localhost:3080
    description: Local development server
tags:
  - name: Authentication
  - name: Account
paths:
  /auth/login:
    post:
      tags:
        - Authentication
      operationId: loginOrCreateAccount
      summary: Trigger login or account creation
      description: Creates a temporary 6-digit verification code. Email delivery is not implemented; development mode can log the code. Limited to one request every 60 seconds and five requests per ten-minute window per normalized email; reissuing does not reset the verification budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: john@doe.com
      responses:
        '429':
          $ref: '#/components/responses/OTPRateLimited'
        '204':
          description: Verification request stored.
        default:
          $ref: '#/components/responses/Error'
  /auth/verify:
    post:
      tags:
        - Authentication
      operationId: verifyAuthenticationCode
      summary: Verify email code
      description: Atomically consumes the provided unexpired email code once, then creates a new session. If no account exists for the email address, a new account is created. Limited to five verification requests per ten-minute window per normalized email, including failed attempts and successful verifications.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
            example:
              email: john@doe.com
              otp: "123456"
      responses:
        '429':
          $ref: '#/components/responses/OTPRateLimited'
        '200':
          description: Verified account and created session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResponse'
              example:
                access_token: eyJhbGciOa...
                refresh_token: X4fFxvY89ypw5f...
                expires_in: 900
                refresh_token_expires_in: 5184000
        default:
          $ref: '#/components/responses/Error'
  /auth/refresh:
    post:
      tags:
        - Authentication
      operationId: refreshSession
      summary: Refresh session tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
            example:
              refresh_token: X4fFxvY89ypw5f...
      responses:
        '200':
          description: Refreshed tokens.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                access_token: eyJhbGciOiJIU...
                refresh_token: eyJhbGciOiJIU...
                expires_in: 900
                refresh_token_expires_in: 5184000
        default:
          $ref: '#/components/responses/Error'
  /account:
    get:
      tags:
        - Account
      operationId: getAccount
      summary: Get account details
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Account information.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
              example:
                email: john@doe.com
                created_at: 1777872664
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags:
        - Account
      operationId: deleteAccount
      summary: Delete account
      description: Deletes the authenticated account. Subsequent requests with its access tokens are rejected and its refresh tokens are removed.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Account deleted.
        default:
          $ref: '#/components/responses/Error'
  /account/email/change:
    patch:
      tags:
        - Account
      operationId: requestEmailChange
      summary: Request an email address change
      description: Limited to one request every 60 seconds and five requests per ten-minute window per account, regardless of target email. Reissuing does not reset the verification budget.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
            example:
              new_email: new@email.com
      responses:
        '429':
          $ref: '#/components/responses/OTPRateLimited'
        '204':
          description: Email change request accepted.
        default:
          $ref: '#/components/responses/Error'
  /account/email/change/confirm:
    patch:
      tags:
        - Account
      operationId: confirmEmailChange
      summary: Confirm an email address change
      description: Limited to five verification requests per ten-minute window per account, including failed attempts and successful verifications.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailConfirmRequest'
            example:
              otp: "123456"
      responses:
        '429':
          $ref: '#/components/responses/OTPRateLimited'
        '204':
          description: Email change confirmed.
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access tokens must contain an expiration and the current account authentication identity. Tokens for deleted accounts and tokens issued before the account identity migration are rejected.
  responses:
    OTPRateLimited:
      description: OTP budget exhausted. Wait for Retry-After seconds before retrying. Limits are shared by server instances using the same database and are not reset by requesting another code.
      headers:
        Retry-After:
          description: Seconds until this request budget resets.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
        - email
      properties:
        email:
          type: string
          format: email
    VerifyRequest:
      type: object
      additionalProperties: false
      required:
        - email
        - otp
      properties:
        email:
          type: string
          format: email
        otp:
          type: string
          description: Six-digit one-time password.
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
    RefreshRequest:
      type: object
      additionalProperties: false
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
    SessionTokens:
      type: object
      additionalProperties: false
      required:
        - access_token
        - refresh_token
        - expires_in
        - refresh_token_expires_in
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          minimum: 0
        refresh_token_expires_in:
          type: integer
          minimum: 0
    VerifyResponse:
      $ref: '#/components/schemas/SessionTokens'
    RefreshResponse:
      $ref: '#/components/schemas/SessionTokens'
    Account:
      type: object
      additionalProperties: false
      required:
        - email
        - created_at
      properties:
        email:
          type: string
          format: email
        created_at:
          type: integer
          description: Account creation timestamp.
    ChangeEmailRequest:
      type: object
      additionalProperties: false
      required:
        - new_email
      properties:
        new_email:
          type: string
          format: email
    ChangeEmailConfirmRequest:
      type: object
      additionalProperties: false
      required:
        - otp
      properties:
        otp:
          type: string
          description: Six-digit one-time password.
          minLength: 6
          maxLength: 6
          pattern: '^[0-9]{6}$'
    Error:
      type: object
      description: Generic JSON error payload.
      additionalProperties: false
      required:
        - error
      properties:
        error:
          type: string
          description: Localized human-readable error message.
