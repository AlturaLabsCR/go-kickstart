name: Build
on:
  push:
  pull_request:
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup
        run: |
          npm ci
          go generate ./...
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o app-linux-$arch .
            upx --best app-linux-$arch
          done

      - name: Upload
        uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: |
            app-linux-arm64
            app-linux-amd64
