name: Build
on:
  push:
  pull_request:
  schedule:
    - cron: '0 9 * * 1'
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine@sha256:1018733457011bf88d81db98cf43aac6d5150afc18787dbe204771fedf80ff95
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kickstart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d kickstart_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: kickstart_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysql --protocol=TCP -h 127.0.0.1 -uroot -pmysql -e 'SELECT 1' kickstart_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Audit npm dependencies
        run: npm audit --audit-level=high

      - name: Install documentation dependencies
        run: npm ci

      - name: Generate code and assets
        run: go generate ./...

      - name: Install release tools
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl

      - name: Test
        run: go test -race ./...
        env:
          TEST_POSTGRES_DSN: postgres://postgres:postgres@127.0.0.1:5432/kickstart_test?sslmode=disable
          TEST_MYSQL_DSN: root:mysql@tcp(127.0.0.1:3306)/kickstart_test

      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

      - name: Build
        run: |
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH=$arch go build -trimpath -ldflags="-s -w" -o app-linux-$arch .
            upx --best app-linux-$arch
          done

      - name: Build container image
        run: |
          docker build --tag app:ci-web .
          docker run --rm --entrypoint nginx app:ci-web -t
          docker build --target app --tag app:ci .

      - name: Scan runtime images
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          for image in app:ci-web app:ci; do
            docker save "$image" -o "$RUNNER_TEMP/trivy/image.tar"
            docker run --rm \
              --mount type=bind,src="$RUNNER_TEMP/trivy",dst=/scan \
              aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb \
              image --cache-dir /scan/cache --scanners vuln \
              --severity HIGH,CRITICAL --exit-code 1 --input /scan/image.tar
          done

      - name: Test independent replicas
        run: python3 contrib/test-multi-instance.py
        env:
          APP_TEST_IMAGE: app:ci

      - name: Store release binaries
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-linux
          path: app-linux-*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-linux
          path: dist
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          fail_on_unmatched_files: true
          files: |
            dist/app-linux-arm64
            dist/app-linux-amd64
