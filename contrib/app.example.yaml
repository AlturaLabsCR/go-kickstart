# app.yaml - Configuration for app
#
# All options here are set to the default values. If no configuration file is
# found, then these values will be used.

# Enable development features like source locations in logs.
# Allows empty or short signing secrets with warnings.
# Override with:
#   APP_DEV=true app serve
#   app serve --dev
dev: false

# Host or interface to bind to. Empty means the default bind behavior.
# Override with:
#   APP_HOST=127.0.0.1 app serve
#   app serve --host 127.0.0.1
host: ""

# TCP port to listen on.
# Override with:
#   APP_PORT=8080 app serve
#   app serve --port 8080
port: 3080

# Auth settings.
# Signing secrets require at least 32 bytes outside development mode.
# Override with:
#   APP_AUTH_SECRET=change-me app serve --dev
#   app serve --dev --auth-secret change-me
#   APP_AUTH_ACCESS_TOKEN_TTL=15m app serve
#   app serve --auth-access-ttl 15m
#   APP_AUTH_REFRESH_TOKEN_TTL=720h app serve
#   app serve --auth-refresh-ttl 720h
auth:
  secret: ""
  access-token-ttl: 15m
  refresh-token-ttl: 720h

# Independent HMAC key used to store verification codes as keyed digests.
# Use at least 32 random bytes outside development; it must differ from auth.secret.
# In development, an empty value uses a temporary key that changes on restart.
# Rotating this key invalidates every pending verification code.
# Override with:
#   APP_OTP_SECRET=change-me app serve --dev
#   app serve --dev --otp-secret change-me
otp:
  secret: ""

# Route prefix to mount the app under.
# Use a clean literal path such as /app/v1, without wildcards, percent encoding,
# dot segments, repeated interior slashes, whitespace, backslashes, query or fragment.
# Override with:
#   APP_ROOT=/app app serve
#   app serve --root /prefix
root: ""

# Log output format. Valid values: json, text.
# Override with:
#   APP_LOGFMT=text app serve
#   app serve --logfmt text
logfmt: json

# Minimum log level. Valid values: debug, info, warn, error.
# Override with:
#   APP_LOGLVL=debug app serve
#   app serve --loglvl debug
loglvl: info

# Database connection string or path.
# Override with:
#   APP_DB=data/custom.sqlite app serve
#   app serve --db data/custom.sqlite
#   app serve --db 'postgres://user:pass@localhost:5432/app?sslmode=disable'
#   app serve --db 'mysql://user:pass@localhost:3306/app'
db: data/app.sqlite

# Sender used when building emails. The default noop mailer discards messages.
# Replace the mailer injected in cmd/server.go to enable actual delivery.
# Override with APP_MAIL_FROM or --mail-from.
mail:
  # Implicit TLS by default (typically port 465); starttls requires STARTTLS.
  smtp:
    address: ""
    user: ""
    password: ""
    starttls: false
  from: no-reply@example.com

# Run `app migrate` separately and disable automatic DDL for replicated servers.
database:
  auto-migrate: true
  max-connections: 10

# Local profile cache has no cross-instance invalidation. Disabled by default.
cache:
  enabled: false

# Kubernetes termination grace must exceed the sum, plus cleanup margin.
http:
  drain-delay: 5s
  shutdown-timeout: 25s

# Exact browser origins allowed to read API responses. Empty disables CORS.
# APP_CORS_ORIGINS=https://web.example.com,https://admin.example.com
# --cors-origins https://web.example.com,https://admin.example.com
cors:
  origins: []
