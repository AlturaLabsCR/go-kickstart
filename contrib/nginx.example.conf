# Include inside nginx's http block (for example, /etc/nginx/conf.d/app.conf).
limit_req_zone $binary_remote_addr zone=otp_issue:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otp_verify:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=session_refresh:1m rate=60r/m;

server {
    listen 80;
    server_name example.com;
    return 308 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;

    # Compress HTML, API responses and other compressible types on every path.
    # HTML is included automatically; skip small bodies and compressed binaries.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript text/xml text/csv text/markdown
               application/javascript application/json application/problem+json
               application/ld+json application/manifest+json application/xml
               application/rss+xml application/atom+xml application/wasm image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    limit_req_status 429;

    location ~ ^/(auth/login|account/email/change)$ {
        limit_req zone=otp_issue burst=2 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location ~ ^/(auth/verify|account/email/change/confirm)$ {
        limit_req zone=otp_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location = /auth/refresh {
        limit_req zone=session_refresh burst=10 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
