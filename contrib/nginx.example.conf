# Include inside http {}; run Go on 127.0.0.1:3080.
# Assumes direct client connections. Configure trusted real IPs behind a proxy.
# Configure TLS before exposing this example publicly in production.

# GET/HEAD and CORS preflights do not consume POST budgets.
map $request_method $limit_ip {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $limit_ip zone=otp_issue:1m rate=10r/m;
limit_req_zone $limit_ip zone=otp_verify:1m rate=30r/m;
limit_req_zone $limit_ip zone=session_refresh:1m rate=60r/m;

server {
    listen 80;
    server_name example.com;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript text/xml text/csv text/markdown
        application/javascript application/json application/problem+json
        application/ld+json application/manifest+json application/xml
        application/rss+xml application/atom+xml application/wasm image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";

    # Suffix matching also covers APP_ROOT without rewriting application paths.
    # Browser POST /login shares issuance limits, including verify/resume/logout.
    location ~ /(?:auth/login|account/email/change|login)$ {
        limit_req zone=otp_issue burst=2 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location ~ /(?:auth/verify|account/email/change/confirm)$ {
        limit_req zone=otp_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location ~ /auth/refresh$ {
        limit_req zone=session_refresh burst=10 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
