# Include inside nginx's http block (for example, /etc/nginx/conf.d/app.conf).
limit_req_zone $binary_remote_addr zone=otp_issue:1m rate=10r/m;
limit_req_zone $binary_remote_addr zone=otp_verify:1m rate=30r/m;
limit_req_zone $binary_remote_addr zone=session_refresh:1m rate=60r/m;

server {
    listen 80;
    server_name example.com;
    return 308 https://example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name example.com;
    ssl_certificate /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    limit_req_status 429;

    location ~ ^/(auth/login|account/email/change)$ {
        limit_req zone=otp_issue burst=2 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location ~ ^/(auth/verify|account/email/change/confirm)$ {
        limit_req zone=otp_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location = /auth/refresh {
        limit_req zone=session_refresh burst=10 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location /s/ {
        gzip on;
        gzip_vary on;
        gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;
        proxy_pass http://127.0.0.1:3080;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
