# Client IP provided by Railway
map $http_x_real_ip $client_ip {
    default $http_x_real_ip;
    ""      $remote_addr;
}

# Original request protocol
map $http_x_forwarded_proto $client_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Rate limiting
limit_req_zone $client_ip zone=otp_issue:1m rate=10r/m;
limit_req_zone $client_ip zone=otp_verify:1m rate=30r/m;
limit_req_zone $client_ip zone=session_refresh:1m rate=60r/m;

server {
    listen 80;
    server_name _;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;

    gzip_types
        text/plain text/css text/javascript
        text/xml text/csv text/markdown
        application/javascript application/json
        application/problem+json application/ld+json
        application/manifest+json application/xml
        application/rss+xml application/atom+xml
        application/wasm image/svg+xml;

    # Reverse proxy
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP $client_ip;

    limit_req_status 429;

    # OTP issue
    location ~ ^/(auth/login|account/email/change)$ {
        limit_req zone=otp_issue burst=2 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }

    # OTP verification
    location ~ ^/(auth/verify|account/email/change/confirm)$ {
        limit_req zone=otp_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }

    # Session refresh
    location = /auth/refresh {
        limit_req zone=session_refresh burst=10 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }

    # All other requests
    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
