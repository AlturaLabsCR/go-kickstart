# myserver.yaml - Configuration for myserver
#
# All options here are set to the default values. If no configuration file is
# found, then these values will be used.

# Enable development features like source locations in logs.
# Override with:
#   MYSERVER_DEV=true myserver serve
#   myserver serve --dev
dev: false

# Host or interface to bind to. Empty means the default bind behavior.
# Override with:
#   MYSERVER_HOST=127.0.0.1 myserver serve
#   myserver serve --host 127.0.0.1
host: ""

# TCP port to listen on.
# Override with:
#   MYSERVER_PORT=8080 myserver serve
#   myserver serve --port 8080
port: 3080

# Auth settings.
# Override with:
#   MYSERVER_AUTH_SECRET=change-me myserver serve
#   myserver serve --auth-secret change-me
#   MYSERVER_AUTH_ACCESS_TOKEN_TTL=15m myserver serve
#   myserver serve --auth-access-ttl 15m
#   MYSERVER_AUTH_REFRESH_TOKEN_TTL=720h myserver serve
#   myserver serve --auth-refresh-ttl 720h
auth:
  secret: ""
  access-token-ttl: 15m
  refresh-token-ttl: 720h

# Route prefix to mount the app under.
# Override with:
#   MYSERVER_ROOT=/app myserver serve
#   myserver serve --root /app
root: ""

# Log output format. Valid values: json, text.
# Override with:
#   MYSERVER_LOGFMT=text myserver serve
#   myserver serve --logfmt text
logfmt: json

# Minimum log level. Valid values: debug, info, warn, error.
# Override with:
#   MYSERVER_LOGLVL=debug myserver serve
#   myserver serve --loglvl debug
loglvl: info

# Database connection string or path.
# Override with:
#   MYSERVER_DB=data/custom.sqlite myserver serve
#   myserver serve --db data/custom.sqlite
db: data/myserver.sqlite
