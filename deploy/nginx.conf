# Railway must be the public ingress: its edge supplies X-Real-IP.
map $http_x_real_ip $railway_ip {
    default $http_x_real_ip;
    "" $remote_addr;
}

# Trust CF-Connecting-IP only when Railway identifies a Cloudflare peer.
# Keep in sync with https://www.cloudflare.com/ips-v4 and /ips-v6.
geo $railway_ip $cloudflare {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

map "$cloudflare:$http_cf_connecting_ip" $client_ip {
    default $railway_ip;
    ~^1:(?<visitor_ip>.+)$ $visitor_ip;
}

# GET/HEAD and CORS preflights do not consume POST budgets.
map $request_method $limit_ip {
    default "";
    POST $client_ip;
}
limit_req_zone $limit_ip zone=otp_issue:1m rate=10r/m;
limit_req_zone $limit_ip zone=otp_verify:1m rate=30r/m;
limit_req_zone $limit_ip zone=session_refresh:1m rate=60r/m;

server {
    listen 80;
    server_name _;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript text/xml text/csv text/markdown
        application/javascript application/json application/problem+json
        application/ld+json application/manifest+json application/xml
        application/rss+xml application/atom+xml application/wasm image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_ip;
    proxy_set_header X-Forwarded-For $client_ip;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Forwarded "";

    # Suffix matching also covers APP_ROOT without rewriting application paths.
    # Browser POST /login shares issuance limits, including verify/resume/logout.
    location ~ /(?:auth/login|account/email/change|login)$ {
        limit_req zone=otp_issue burst=2 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location ~ /(?:auth/verify|account/email/change/confirm)$ {
        limit_req zone=otp_verify burst=5 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location ~ /auth/refresh$ {
        limit_req zone=session_refresh burst=10 nodelay;
        proxy_pass http://127.0.0.1:3080;
    }
    location / {
        proxy_pass http://127.0.0.1:3080;
    }
}
