services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$${MYSQL_PASSWORD}" mysql --protocol=TCP -h127.0.0.1 -uapp app -e "SELECT 1" >/dev/null']
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 20
    networks: [backend]
    restart: unless-stopped

  app:
    build: .
    environment:
      APP_DEV: "false"
      APP_HOST: "0.0.0.0"
      APP_PORT: "3080"
      APP_DB: app:${MYSQL_PASSWORD}@tcp(mysql:3306)/app
      APP_AUTH_SECRET: ${APP_AUTH_SECRET:?Set APP_AUTH_SECRET}
      APP_OTP_SECRET: ${APP_OTP_SECRET:?Set APP_OTP_SECRET}
      APP_ROOT: ${APP_ROOT:-}
      APP_MAIL_FROM: ${APP_MAIL_FROM:-no-reply@example.com}
      APP_MAIL_SMTP_ADDRESS: ${APP_MAIL_SMTP_ADDRESS:-}
      APP_MAIL_SMTP_USER: ${APP_MAIL_SMTP_USER:-}
      APP_MAIL_SMTP_PASSWORD: ${APP_MAIL_SMTP_PASSWORD:-}
      APP_MAIL_SMTP_STARTTLS: ${APP_MAIL_SMTP_STARTTLS:-false}
    depends_on:
      mysql:
        condition: service_healthy
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 40s

  nginx:
    image: nginx:stable-alpine
    configs:
      - source: nginx
        target: /etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_started
        restart: true
    expose: ["80"]
    networks: [backend]
    restart: unless-stopped
    stop_grace_period: 40s

configs:
  nginx:
    content: |
      server {
          listen 80;
          server_name _;

          gzip on;
          gzip_vary on;
          gzip_proxied any;
          gzip_comp_level 5;
          gzip_min_length 256;
          gzip_types text/plain text/css text/javascript text/xml text/csv text/markdown
                     application/javascript application/json application/problem+json
                     application/ld+json application/manifest+json application/xml
                     application/rss+xml application/atom+xml application/wasm image/svg+xml;

          location / {
              proxy_http_version 1.1;
              proxy_set_header Connection "";
              proxy_set_header Host $$http_host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
              proxy_pass http://app:3080;
          }
      }

networks:
  backend:

volumes:
  mysql-data:
